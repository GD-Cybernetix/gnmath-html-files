<html lang="en-us">
<base href="https://rawcdn.githack.com/bubbls/UGS-Assets/eb32298b67aacb3c73695ddfd68cb04803b3235e/going%20balls/">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Going Balls </title>
  <meta name="description" content="Going Balls is a fun game that you can play at school from chromebook. In our catalog you can find many cool online games that you may enjoy.">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
      html,
      body {
          margin: 0;
          padding: 0;
          overflow: hidden;
          height: 100%;
          width: 100%;
      }

      #unity-container {
          width: 100%;
          height: 100%;
          position: fixed;
          top: 0;
          left: 0;
      }
  </style>
  <script src="https://pl28729284.effectivecpmnetwork.com/e3/ae/fb/e3aefbb699fcb7ed39a8fa8884c521d5.js"></script>
</head>

<body>

  <div id="interstitialOverlay">
    <div id="interstitialBox">
      <div id="container-9e9f96078bb02b26ee2271127f64a418"></div>
      <script async="async" data-cfasync="false"
        src="//pl29480014.effectivecpmnetwork.com/9e9f96078bb02b26ee2271127f64a418/invoke.js"></script>
      <p id="interstitialTimer">Ad closes in <span id="countdown">5</span>s...</p>
      <button id="interstitialClose" disabled
        onclick="document.getElementById('interstitialOverlay').style.display='none'">Play Game</button>
    </div>
  </div>
  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build_6.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build_6.data",
      frameworkUrl: buildUrl + "/Build_6.framework.js",
      codeUrl: buildUrl + "/Build_6.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DEFU Games",
      productName: "Going Balls",
      productVersion: "0.1",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';

        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          canvas.style.width = window.innerWidth + "px";
          canvas.style.height = window.innerHeight + "px";
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
      }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
  
</body>

</html>
