    <div id="interstitialBox">

      <p id="interstitialTimer">Ad closes in <span id="countdown">5</span>s...</p>

  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>

	<!-- start-fast-library -->
    <script type="text/javascript" nonce="nEsvHewDKSKQZPWExNde-A">
		document.addEventListener('fastloaded', function(e)
		{
			window.fast.gameReady = function()
			{
				window.fast.goGame({
					prepare:prepareGame,
					body:["vendor/phaser.min.js", "vendor/box2d-p3.min.js", "pou.min.js"],
					init:function(){ window.gameStart(), window.fastActivePopup(), ytgame.game.firstFrameReady() },
					enterfs:function(){ },
					exitfs:function(){ },
					afterinfs:function(){ window.fastCheckMiniGameForMiui(true) }
				});
				console.log("inside [gameReady] -> "+window.fast.lang);
			}
			window.fast.stageElements(window.fast.gameReady, {fsbehind:true, nostats:true});
		}, false);
    </script>
	<!-- end-fast-library -->
	
	<script nonce="nEsvHewDKSKQZPWExNde-A">
		async function prepareGame()
		{
			//check audio
			window.fast.gameAudio = ytgame.system.isAudioEnabled();
			//check lang
			await ytgame.system.getLanguage().then(function(lang)
			{
				//strip the subtag and default to english if not supported
				lang = lang.split('-')[0];
				lang = (window.fast.info.languages.indexOf(lang)>-1) ? lang : window.fast.info.languages[0];
				console.log('set lang to '+lang);
				window.fast.lang = lang;
				return new Promise((resolve, reject) => { resolve() });
			});
		}
		//onchangeaudio
		ytgame.system.onAudioEnabledChange(function(isAudioEnabled)
		{
			if(window.fast) window.fast.gameAudio = isAudioEnabled;
			if(typeof window.fastEnableAudio==="function") window.fastEnableAudio(isAudioEnabled);
		});
	</script>
