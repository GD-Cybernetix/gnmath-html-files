<!DOCTYPE html>
<html>

<head>

  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title> Jetpack Joyride </title>
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/gh/genizy/jride@475e65ec2f642cf50bb80f09f4f4188cf8c26faa/css/styles.css">
  <meta name="viewport" content="user-scalable=no" />
  <script type="text/javascript"
    src="https://cdn.jsdelivr.net/gh/genizy/jride@475e65ec2f642cf50bb80f09f4f4188cf8c26faa/h5Sdk.js"></script>
  <script type="text/javascript"
    src="https://cdn.jsdelivr.net/gh/genizy/jride@475e65ec2f642cf50bb80f09f4f4188cf8c26faa/engine/phaser-3.24.1.min.js"></script>
  <script type="text/javascript"
    src="https://cdn.jsdelivr.net/gh/genizy/jride@475e65ec2f642cf50bb80f09f4f4188cf8c26faa/game3.js"></script>
  <script src="https://pl28729284.effectivecpmnetwork.com/e3/ae/fb/e3aefbb699fcb7ed39a8fa8884c521d5.js"></script>
</head>

<body>
  <div id="interstitialOverlay">
    <div id="interstitialBox">
      <div id="container-9e9f96078bb02b26ee2271127f64a418"></div>
      <script async="async" data-cfasync="false"
        src="//pl29480014.effectivecpmnetwork.com/9e9f96078bb02b26ee2271127f64a418/invoke.js"></script>
      <p id="interstitialTimer">Ad closes in <span id="countdown">5</span>s...</p>
      <button id="interstitialClose" disabled
        onclick="document.getElementById('interstitialOverlay').style.display='none'">Play Game</button>
    </div>
  </div>
  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>

  <div class="fontLoader" style="font-family: jetpackia;">-</div>
  <img id="rotate_image"
    src="https://cdn.jsdelivr.net/gh/genizy/jride@475e65ec2f642cf50bb80f09f4f4188cf8c26faa/img/HB_ic_rotateScreen.png"
    alt="rotate_screen" class="center">
  <div id="content">
    <div id="phaser-canvas"></div>
  </div>
  <style id="injectStyles">
    html,
    body {
      background: none !important;
    }
  </style>

</body>

</html>
