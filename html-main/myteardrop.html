<body>

  <div id="interstitialOverlay">
    <div id="interstitialBox">
      <div id="container-9e9f96078bb02b26ee2271127f64a418"></div>
      <script async="async" data-cfasync="false"
        src="//pl29480014.effectivecpmnetwork.com/9e9f96078bb02b26ee2271127f64a418/invoke.js"></script>
      <p id="interstitialTimer">Ad closes in <span id="countdown">5</span>s...</p>
      <button id="interstitialClose" disabled
        onclick="document.getElementById('interstitialOverlay').style.display='none'">Play Game</button>
    </div>
  </div>
  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>


</html>
<style>
    canvas {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        /*top: 0px;

        position: fixed;
        object-fit: contain;
    }

    #collecting {
        left: 50%;
        transform: translate(-50%, 0%);
        position: fixed;
        animation-iteration-count: infinite;
        animation: scale 4s infinite ease-in-out;
        filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.2));
    }

    @keyframes scale {
        0% {
            width: calc(20% + 80px);
        }

        50% {
            width: calc(20% + 90px);
        }

        100% {
            width: calc(20% + 80px);
        }
    }

    body {
        background-color: black;
        overflow: hidden;
    }

    * {
        user-select: none;
        -webkit-user-select: none;
    }

    #loader {
        top: 50%;

        font-weight: 400;
        line-height: 5px;
        font-size: 12px;
        width: calc(40% + 80px);

        height: 10px;
        padding: 1px;
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
        outline: 2px solid #00000020;

    #loader p {
        margin-left: 10px;

    #bar {
        width: 0px;

    #loadbackground {
