<!DOCTYPE html>

<head>

    <title>Flappy Bird Multiplayer</title>
    <style>
        html,
        body {
            background: #000;
            width: 100%;

            overflow: visible;
            padding: 0;
            margin: 0;
        }

        div#gameContainer {
            background: transparent !important;
            position: absolute;
        }

        div#gameContainer canvas {
            position: absolute;
        }

        div#gameContainer canvas[data-pixel-art="true"] {

            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;

        }

</head>

<body>

  <div id="interstitialOverlay">
    <div id="interstitialBox">
      <div id="container-9e9f96078bb02b26ee2271127f64a418"></div>
      <script async="async" data-cfasync="false"
        src="//pl29480014.effectivecpmnetwork.com/9e9f96078bb02b26ee2271127f64a418/invoke.js"></script>
      <p id="interstitialTimer">Ad closes in <span id="countdown">5</span>s...</p>
      <button id="interstitialClose" disabled
        onclick="document.getElementById('interstitialOverlay').style.display='none'">Play Game</button>
    </div>
  </div>
  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>

    <div id="gameContainer">
        <canvas id="unity-canvas" data-pixel-art=""></canvas>
        <script src="Build/V0.1.loader.js"></script>
        <script>
            function mergeFiles(fileParts) {
                return new Promise((resolve, reject) => {
                    let buffers = [];

                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }
                        fetch(fileParts[index]).then(response => response.arrayBuffer()).then(data => {
                            buffers.push(data);
                            fetchPart(index + 1);
                        }).catch(reject);
                    }
                    fetchPart(0);
                });
            }
            var parts = ["Build/V0.1.wasm.part1", "Build/V0.1.wasm.part2"];
            Promise.all([
                mergeFiles(parts)
            ]).then(([mergedUrl]) => {
                var canvas = document.querySelector("#unity-canvas");
                var config = {
                    dataUrl: "Build/V0.1.data",
                    frameworkUrl: "Build/V0.1.framework.js",
                    codeUrl: mergedUrl,
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "eli_hoffman",
                    productName: "Flappy Bird Multiplayer",
                    productVersion: "0.1",
                };
                var scaleToFit;
                try {
                    scaleToFit = !!JSON.parse("");
                } catch (e) {
                    scaleToFit = true;
                }

                function progressHandler(progress) {
                    var percent = progress * 100 + '%';
                    canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
                    canvas.style.backgroundSize = '100% 1rem';
                }

                function onResize() {
                    var container = canvas.parentElement;
                    var w;
                    var h;
                    if (scaleToFit) {
                        w = window.innerWidth;
                        h = window.innerHeight;
                        var r = 800 / 600;
                        if (w * r > window.innerHeight) {
                            w = Math.min(w, Math.ceil(h / r));
                        }
                        h = Math.floor(w * r);
                    } else {
                        w = 600;
                        h = 800;
                    }
                    container.style.width = canvas.style.width = w + "px";
                    container.style.height = canvas.style.height = h + "px";
                    container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
                    container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
                }
                createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                    canvas = instance.Module.canvas;
                    onResize();
                });
                window.addEventListener('resize', onResize);
                onResize();
                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    // Mobile device style: fill the whole browser client area with the game canvas:
                    const meta = document.createElement('meta');
                    meta.name = 'viewport';
                    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                    document.getElementsByTagName('head')[0].appendChild(meta);
                }
            }).catch(error => {
                console.error(error);
            });
        </script>
    </div>
</body>

</html>
