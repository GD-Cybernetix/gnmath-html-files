<body>

  <div id="interstitialOverlay">
    <div id="interstitialBox">
      <div id="container-9e9f96078bb02b26ee2271127f64a418"></div>
      <script async="async" data-cfasync="false"
        src="//pl29480014.effectivecpmnetwork.com/9e9f96078bb02b26ee2271127f64a418/invoke.js"></script>
      <p id="interstitialTimer">Ad closes in <span id="countdown">5</span>s...</p>
      <button id="interstitialClose" disabled
        onclick="document.getElementById('interstitialOverlay').style.display='none'">Play Game</button>
    </div>
  </div>
  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>

  <div id="flash-container"></div>

  <script>
    const container = document.getElementById("flash-container");

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 4 / 3;

      let width = Math.floor(windowWidth);
      let height = Math.floor(windowWidth / aspectRatio);

      if (height > windowHeight) {
        height = Math.floor(windowHeight);
        width = Math.floor(height * aspectRatio);
      }

      container.style.width = `${width}px`;
      container.style.height = `${height}px`;
    }

    window.addEventListener("resize", resizeGame);
    window.addEventListener("DOMContentLoaded", () => {
      resizeGame();

      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (ruffle && container) {
        const player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        player.style.background = "black";
        container.appendChild(player);
        player.load("https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@754a57837e92bb4552e8247c6a401bd4ce8e4ee7/599993_dingo.swf");
      } else {
        container.textContent = "Ruffle failed to load.";
      }
    });
  </script>
</body>
</html>
