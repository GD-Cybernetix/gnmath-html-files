  <style>
    #interstitialOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #interstitialBox {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    #container-9e9f96078bb02b26ee2271127f64a418 {
      min-height: 250px;
    }

    #interstitialTimer {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0 8px;
      font-family: Arial, sans-serif;
    }

    #interstitialClose {
      padding: 10px 36px;
      background: #fc2651;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #interstitialClose:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
  <script>
    (function () {
      var sec = 5;
      var btn = document.getElementById('interstitialClose');
      var span = document.getElementById('countdown');
      var iv = setInterval(function () {
        sec--;
        span.textContent = sec;
        if (sec <= 0) {
          clearInterval(iv);
          btn.disabled = false;
          btn.textContent = 'Play Game';
          document.getElementById('interstitialTimer').style.display = 'none';
        }
      }, 1000);
    })();
  </script>

    <canvas id="canvas" style="width: 50%; height: 50%; display: block; margin: 0 auto;" onClick="window.focus();" />

    <script type="text/javascript">
        function $_GET(param) {
            var vars = {};
            window.location.href.replace(location.hash, '').replace(
                /[?&]+([^=&]+)=?([^&]*)?/gi, // regexp
                function(m, key, value) { // callback
                    vars[key] = value !== undefined ? value : '';
                }
            );
            if (param) {
                return vars[param] ? vars[param] : null;
            }
            return vars;
        }

        var softs = {

            OREGON: {
                file: 'softs/OREGON.zip',
                cmd: 'OREGON/OREGON.EXE',
                pointer: true
            },



        }
        var file = "OREGON";
        if ($_GET('soft') != null) {
            if (softs[$_GET('soft')] != undefined) {
                file = $_GET('soft')
                    //parent.$notif('Loading '+$_GET('soft').replace(/_/g," ")+'.')
            };
        };
        //
        // DOS FILES
        if (softs[file].machine == undefined) {
            var dosbox = new Emulator(document.querySelector("#canvas"),
                null,
                new DosBoxLoader(DosBoxLoader.emulatorJS("js/dosbox-sync.js"),
                    DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
                    DosBoxLoader.nativeResolution(640, 400),
                    DosBoxLoader.mountZip("c",
                        //DosBoxLoader.fetchFile("Software", "softs/" + softs[file].file)),
                        DosBoxLoader.fetchFile("Software", softs[file].file)),
                    DosBoxLoader.startExe(softs[file].cmd)));
            dosbox.start({
                waitAfterDownloading: false
            });

            function locateAdditionalFiles(filename) {
                if (filename === "dosbox.html.mem") {
                    return "js/dosbox-sync.mem";
                }
                return "js/" + filename;
            }

        }
        //
        // PC98 DOS FILES
        if (softs[file].machine == 'PC98') {
            var dosbox = new Emulator(document.querySelector("#canvas"),
                null,
                new PC98DosBoxLoader(PC98DosBoxLoader.emulatorJS("js/dosbox-x.js"),
                    PC98DosBoxLoader.emulatorWASM("js/dosbox-x.wasm"),
                    PC98DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
                    PC98DosBoxLoader.nativeResolution(640, 480),
                    PC98DosBoxLoader.mountZip("c",
                        PC98DosBoxLoader.fetchFile("Game File",
                            "softs/" + softs[file].file)),
                    PC98DosBoxLoader.mountZip("y",
                        PC98DosBoxLoader.fetchFile("ROM File",
                            "js/font.zip")),

                    PC98DosBoxLoader.startExe(softs[file].cmd)))
            dosbox.start({
                waitAfterDownloading: true
            });

            function locateAdditionalFiles(filename) {
                if (filename === "dosbox.html.mem") {
                    return "js/dosbox-sync.mem";
                }
                return "js/" + filename;
            }


        }

        if (softs[file].pointer == false) {
            c = document.getElementById("canvas")
            c.style.cursor = "none"
        };
    </script>
